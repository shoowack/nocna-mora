services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      - DATABASE_URI=postgresql://tvarhiv:${DB_PASSWORD:-tvarhiv}@db:5432/tvarhiv
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-change-me-in-production}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - NEXT_PUBLIC_SITE_URL=${SITE_URL:-http://localhost:3000}
      - NODE_OPTIONS=--max-old-space-size=2048
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tvarhiv
      POSTGRES_USER: tvarhiv
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tvarhiv}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvarhiv"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  media_data:
